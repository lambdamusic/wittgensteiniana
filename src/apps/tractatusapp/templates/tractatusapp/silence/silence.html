{% load static %}


<!DOCTYPE html>
<html>
<head>
	{% include 'tractatusapp/ga.html' %}

	<meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
	<title>Silence Spiral Tractatus</title>

	<script type="text/javascript" src="{% static 'custom/tractatusapp/vendor/d3.v7.min.js' %}"></script>

	<style type="text/css">

		html, body { margin: 0; padding: 0; background: #0d0d0f; color: #ddd; font-family: arial, sans-serif; }

		#header { padding: 15px 20px 5px 20px; }
		#header h1 { margin: 0 0 5px 0; font-size: 22px; color: #cfcfcf; }
		#header .homelink { font-size: 11px; color: #8ab4d8; }
		#description { padding: 0 20px 10px 20px; font-size: 13px; color: #aaa; line-height: 1.5; }

		#chart-container { position: relative; padding: 0 20px; }

		.spiral-segment { fill: none; stroke-width: 1.3px; }
		.spiral-dot { }

		.axis text { font-size: 11px; fill: #888; }

		#tooltip {
			position: absolute;
			pointer-events: none;
			background: rgba(240, 240, 240, 0.95);
			color: #111;
			padding: 8px 10px;
			border-radius: 4px;
			font-size: 12px;
			line-height: 1.4;
			max-width: 320px;
			display: none;
		}
		#tooltip b { color: #750b0b; }

		#finale {
			position: fixed;
			top: 0; left: 0; right: 0; bottom: 0;
			background: rgba(0, 0, 0, 0.88);
			color: #eee;
			display: none;
			align-items: center;
			justify-content: center;
			text-align: center;
			cursor: pointer;
			font-size: 22px;
			line-height: 1.6;
			padding: 40px;
			box-sizing: border-box;
		}
		#finale .prop-number { color: #d88; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; display: block; margin-bottom: 20px; }
		#finale .hint { position: absolute; bottom: 30px; font-size: 11px; color: #777; }

		#subfooter {
			margin: 20px 20px 40px 20px;
			font-size: 11px;
			color: #666;
		}

	</style>
</head>


<body>

	<div id="header">
		<h1>The Silence Spiral
			<a class="homelink" href="{% url 'tractatusapp:witt_about' %}">home</a>
		</h1>
	</div>

	<div id="description">{{ experiment_description|safe }}</div>

	<div id="chart-container">
		<svg id="chart"></svg>
		<div id="tooltip"></div>
	</div>

	<div id="finale">
		<div>
			<span class="prop-number"></span>
			<div class="finale-text"></div>
		</div>
		<div class="hint">click anywhere to keep exploring</div>
	</div>

	<div id="subfooter">
		Ludwig Wittgenstein, Tractatus Logico-Philosophicus, 1921. Translated from the German by C.K. Ogden, 1922.
	</div>


	<script type="text/javascript">

		var DATA = {{ json|safe }};
		var N = DATA.length;

		var width = Math.max(700, Math.min(900, window.innerWidth - 60)),
			height = width;

		var svg = d3.select("#chart")
			.attr("width", width)
			.attr("height", height);

		var g = svg.append("g");

		var cx = width / 2, cy = height / 2;
		var R_MAX = Math.min(width, height) / 2 - 20;
		var TURNS = 9;
		var POWER = 1.6;

		var chapterColor = d3.scaleOrdinal()
			.domain([1, 2, 3, 4, 5, 6, 7])
			.range(["#e07a7a", "#8fbf6a", "#7a8fe0", "#e0c26a", "#c07ae0", "#6ac2c2", "#e0a06a"]);

		function angleOf(i) { return (i / (N - 1)) * TURNS * 2 * Math.PI - Math.PI / 2; }
		function radiusOf(i) { return R_MAX * Math.pow(1 - i / (N - 1), POWER); }

		DATA.forEach(function (d, i) {
			var a = angleOf(i), r = radiusOf(i);
			d._x = cx + r * Math.cos(a);
			d._y = cy + r * Math.sin(a);
			d._i = i;
		});

		var line = d3.line()
			.x(function (d) { return d._x; })
			.y(function (d) { return d._y; })
			.curve(d3.curveCardinal.tension(0.85));

		// draw one path segment per contiguous chapter run, colored by chapter
		var spans = [];
		DATA.forEach(function (d, i) {
			var last = spans[spans.length - 1];
			if (!last || last.chapter !== d.chapter) {
				spans.push({ chapter: d.chapter, start: i, end: i });
			} else {
				last.end = i;
			}
		});

		spans.forEach(function (s) {
			var slice = DATA.slice(Math.max(0, s.start - 1), s.end + 1); // overlap by 1 so segments connect
			g.append("path")
				.datum(slice)
				.attr("class", "spiral-segment")
				.attr("stroke", chapterColor(s.chapter))
				.attr("d", line);
		});

		g.selectAll("circle.spiral-dot")
			.data(DATA)
			.join("circle")
			.attr("class", "spiral-dot")
			.attr("cx", function (d) { return d._x; })
			.attr("cy", function (d) { return d._y; })
			.attr("r", function (d) { return 1 + 2 * (1 - d._i / (N - 1)); })
			.attr("fill", function (d) { return chapterColor(d.chapter); })
			.attr("opacity", function (d) { return 0.35 + 0.5 * (1 - d._i / (N - 1)); });

		var focusCircle = g.append("circle")
			.attr("r", 5)
			.attr("fill", "none")
			.attr("stroke", "#fff")
			.attr("stroke-width", 1.5)
			.style("display", "none");

		var tooltip = d3.select("#tooltip");
		var quadtree = d3.quadtree()
			.x(function (d) { return d._x; })
			.y(function (d) { return d._y; })
			.addAll(DATA);

		var currentTransform = d3.zoomIdentity;

		svg.on("mousemove", function (event) {
			var [mx, my] = d3.pointer(event, g.node());
			var d = quadtree.find(mx, my, 40 / currentTransform.k);
			if (!d) { hideFocus(); return; }

			focusCircle.attr("cx", d._x).attr("cy", d._y).style("display", null);
			tooltip
				.style("display", "block")
				.style("left", (event.offsetX + 20) + "px")
				.style("top", (event.offsetY) + "px")
				.html("<b>" + d.name + "</b> (chapter " + d.chapter + ")<br />" + (d.text || ""));
		}).on("mouseleave", hideFocus);

		function hideFocus() {
			focusCircle.style("display", "none");
			tooltip.style("display", "none");
		}

		var zoom = d3.zoom()
			.scaleExtent([1, 15])
			.on("zoom", function (event) {
				currentTransform = event.transform;
				g.attr("transform", event.transform);
			});

		svg.call(zoom);

		// finale: the spiral converges on the last point - proposition 7 itself
		var finale = d3.select("#finale");
		var last = DATA[DATA.length - 1];

		finale.on("click", function () { finale.style("display", "none"); });

		function showFinale() {
			finale.select(".prop-number").text("Proposition " + last.name);
			finale.select(".finale-text").text(last.text);
			finale.style("display", "flex");
		}

		setTimeout(showFinale, 2200);

	</script>

</body>
</html>
