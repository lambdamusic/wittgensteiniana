{% load static %}


<!DOCTYPE html>
<html>
<head>
	{% include 'tractatusapp/ga.html' %}

	<meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
	<title>The Ladder Tractatus</title>

	<script type="text/javascript" src="{% static 'custom/tractatusapp/vendor/d3.v7.min.js' %}"></script>

	<style type="text/css">

		html, body { margin: 0; padding: 0; background: #101014; color: #ddd; font-family: georgia, serif; }

		#header { padding: 25px 20px 15px 20px; font-family: arial, sans-serif; }
		#header h1 { margin: 0 0 5px 0; font-size: 22px; color: #cfcfcf; }
		#header .homelink { font-size: 11px; color: #8ab4d8; }
		#description { padding: 0 20px 20px 20px; font-size: 13px; color: #aaa; line-height: 1.6; font-family: arial, sans-serif; }

		#ladder { max-width: 720px; margin: 0 auto; padding: 10px 20px 200px 20px; }

		.rung {
			border-left: 3px solid #555;
			padding: 10px 16px;
			margin-bottom: 3px;
			transition: opacity 0.7s ease, filter 0.7s ease, background 0.4s ease;
			opacity: 1;
			filter: grayscale(0);
		}
		.rung .rung-number { font-family: arial, sans-serif; font-size: 11px; font-weight: bold; letter-spacing: 1px; display: block; margin-bottom: 4px; opacity: 0.85; }
		.rung .rung-text { font-size: 16px; line-height: 1.5; }

		.rung.dissolved { opacity: 0.06; filter: grayscale(1); }
		.rung.current { background: rgba(255, 255, 255, 0.06); }

		#finale {
			max-width: 720px;
			margin: 60px auto 120px auto;
			padding: 0 20px;
			text-align: center;
			font-size: 26px;
			line-height: 1.7;
			color: #eee;
		}
		#finale .finale-label { display: block; font-family: arial, sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #d88; margin-bottom: 20px; }

		#progress {
			position: fixed;
			top: 0; left: 0;
			height: 2px;
			background: #d88;
			width: 0%;
			z-index: 10;
		}

	</style>
</head>


<body>

	<div id="progress"></div>

	<div id="header">
		<h1>The Ladder
			<a class="homelink" href="{% url 'tractatusapp:witt_about' %}">home</a>
		</h1>
	</div>

	<div id="description">{{ experiment_description|safe }}</div>

	<div id="ladder"></div>

	<div id="finale"></div>


	<script type="text/javascript">

		var DATA = {{ json|safe }};

		var chapterColor = d3.scaleOrdinal()
			.domain([1, 2, 3, 4, 5, 6, 7])
			.range(["#e07a7a", "#8fbf6a", "#7a8fe0", "#e0c26a", "#c07ae0", "#6ac2c2", "#e0a06a"]);

		var rungs = d3.select("#ladder")
			.selectAll(".rung")
			.data(DATA)
			.join("div")
			.attr("class", "rung")
			.attr("id", function (d) { return "rung-" + d.id; })
			.style("margin-left", function (d) { return (d.depth * 26) + "px"; })
			.style("border-left-color", function (d) { return chapterColor(d.chapter); });

		rungs.append("span")
			.attr("class", "rung-number")
			.style("color", function (d) { return chapterColor(d.chapter); })
			.text(function (d) { return d.name; });

		rungs.append("div")
			.attr("class", "rung-text")
			.text(function (d) { return d.text; });

		// finale: the last rung is proposition 7 itself - by the time it's
		// reached, every rung above has already dissolved behind you.
		var last = DATA[DATA.length - 1];
		d3.select("#finale").html(
			'<span class="finale-label">Proposition ' + last.name + '</span>' + last.text
		);

		// dissolve rungs once scrolled past; restore them if scrolled back up
		var dissolveObserver = new IntersectionObserver(function (entries) {
			entries.forEach(function (entry) {
				if (entry.isIntersecting) {
					entry.target.classList.remove("dissolved");
				} else if (entry.boundingClientRect.top < 0) {
					entry.target.classList.add("dissolved");
				}
			});
		}, { threshold: 0, rootMargin: "0px 0px -8% 0px" });

		// highlight whichever rung is nearest the vertical center of the viewport
		var currentObserver = new IntersectionObserver(function (entries) {
			entries.forEach(function (entry) {
				if (entry.isIntersecting) {
					document.querySelectorAll(".rung.current").forEach(function (r) { r.classList.remove("current"); });
					entry.target.classList.add("current");
				}
			});
		}, { threshold: 0, rootMargin: "-45% 0px -45% 0px" });

		document.querySelectorAll(".rung").forEach(function (el) {
			dissolveObserver.observe(el);
			currentObserver.observe(el);
		});

		// thin progress bar across the top, tracking scroll position
		window.addEventListener("scroll", function () {
			var scrollable = document.documentElement.scrollHeight - window.innerHeight;
			var pct = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;
			document.getElementById("progress").style.width = pct + "%";
		});

	</script>

</body>
</html>
